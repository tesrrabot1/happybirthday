<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8e9ed">
  <title>Праздничная открытка</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap');
    :root {
      --ink:#49383f; --rose:#c9788c; --rose-dark:#a95770;
      --cream:#fffaf7; --gold:#c9a66b; --muted:#806e73;
    }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; }
    body {
      min-height:100vh; overflow-x:hidden; color:var(--ink);
      font-family:Manrope,system-ui,sans-serif;
      background:
        radial-gradient(ellipse at 15% 15%, rgba(255,255,255,.9), transparent 35%),
        radial-gradient(ellipse at 85% 80%, rgba(239,195,204,.55), transparent 38%),
        linear-gradient(135deg,#f8e9ed,#f8f0e7 55%,#f5e4e8);
    }
    button { font:inherit; }
    .sound-toggle {
      position:fixed; z-index:20; top:18px; right:18px; width:46px; height:46px;
      border:1px solid rgba(169,87,112,.22); border-radius:50%; color:var(--rose-dark);
      background:rgba(255,250,247,.82); box-shadow:0 8px 24px #8c58621c;
      cursor:pointer; font-size:19px; backdrop-filter:blur(12px);
    }
    .sound-toggle:focus-visible,.nav-btn:focus-visible,.dot:focus-visible,
    .replay:focus-visible,.envelope:focus-visible { outline:3px solid #b86b82; outline-offset:4px; }
    .screen { min-height:100vh; display:grid; place-items:center; padding:82px 20px 36px; }
    .intro { text-align:center; }
    .intro-note { color:var(--muted); letter-spacing:.18em; text-transform:uppercase; font-size:.72rem; margin-bottom:26px; }
    .envelope-wrap { perspective:1000px; }
    .envelope {
      position:relative; display:block; width:min( min(78vw,390px), 390px); aspect-ratio:1.35;
      border:0; padding:0; background:transparent; cursor:pointer; margin:auto;
      animation:float 3.2s ease-in-out infinite;
    }
    .env-back { position:absolute; inset:0; border-radius:13px; background:linear-gradient(145deg,#e7b9c3,#c9788c); box-shadow:0 24px 55px #8d566333; }
    .env-front {
      position:absolute; inset:0; overflow:hidden; border-radius:13px;
      background:linear-gradient(145deg,#f6dce1,#e8b8c4);
      clip-path:polygon(0 0,50% 57%,100% 0,100% 100%,0 100%);
    }
    .env-flap {
      position:absolute; inset:0; background:linear-gradient(145deg,#fbe9e9,#d994a5);
      clip-path:polygon(0 0,100% 0,50% 62%); transform-origin:top; transition:transform .9s ease;
      filter:drop-shadow(0 3px 2px #9d526322);
    }
    .letter {
      position:absolute; left:9%; right:9%; top:10%; height:78%; border-radius:9px;
      background:var(--cream); display:grid; place-content:center; gap:8px;
      box-shadow:0 4px 18px #8d566322; transition:transform .9s ease;
    }
    .letter strong { font:600 clamp(2rem,7vw,3.2rem) "Cormorant Garamond",Georgia,serif; color:var(--rose-dark); }
    .letter span { font-size:.75rem; color:var(--muted); letter-spacing:.08em; }
    .seal {
      position:absolute; left:50%; top:57%; transform:translate(-50%,-50%);
      width:53px; height:53px; border-radius:50%; display:grid; place-items:center;
      color:#fff7f3; background:linear-gradient(145deg,#c77b8c,#a95770);
      box-shadow:0 5px 15px #8d566344; font-size:22px;
    }
    .hint { margin-top:34px; color:var(--rose-dark); font-size:.9rem; letter-spacing:.04em; }
    .hint::after { content:""; display:block; width:38px; height:1px; background:var(--gold); margin:14px auto 0; }
    .intro.opening .env-flap { transform:rotateX(180deg); transition:transform 3.2s cubic-bezier(.2,.75,.2,1); }
    .intro.opening .letter { transform:translateY(-48%) scale(1.06); transition:transform 3.3s cubic-bezier(.2,.75,.2,1); }
    .intro.opening .envelope { animation:none; opacity:0; transform:scale(.9); transition:opacity 1s ease 3.15s,transform 1s ease 3.15s; }
    .envelope::after {
      content:""; position:absolute; z-index:5; left:50%; top:48%; width:65%; height:70%;
      transform:translate(-50%,-50%) scale(.45); border-radius:50%;
      background:radial-gradient(ellipse,rgba(255,225,158,.9),rgba(255,221,165,.28) 42%,transparent 72%);
      opacity:0; pointer-events:none;
    }
    .intro.opening .envelope::after { animation:letterGlow 3.5s ease-out forwards; }
    .surprise-heart {
      position:absolute; z-index:8; left:50%; top:42%; color:#c9788c; font-size:30px;
      opacity:0; pointer-events:none; text-shadow:0 0 18px #f3d28c;
    }
    .intro.opening .surprise-heart { animation:heartRise 2.3s ease-out .9s forwards; }
    @keyframes letterGlow { 0%{opacity:0;transform:translate(-50%,-40%) scale(.35)} 45%{opacity:1} 100%{opacity:0;transform:translate(-50%,-75%) scale(1.8)} }
    @keyframes heartRise { 0%{opacity:0;transform:translate(-50%,20px) scale(.4)} 20%{opacity:1} 75%{opacity:1} 100%{opacity:0;transform:translate(-50%,-100px) scale(1.25)} }
    @keyframes float { 0%,100%{transform:translateY(0) rotate(-.4deg)} 50%{transform:translateY(-10px) rotate(.4deg)} }

    .showcase { display:none; width:min(1100px,100%); margin:auto; }
    .showcase.visible { display:block; animation:fadeIn .7s ease both; }
    .slide-stage { min-height:min(75vh,760px); display:grid; place-items:center; position:relative; }
    .slide {
      width:100%; display:grid; grid-template-columns:minmax(0,1.1fr) minmax(260px,.9fr);
      align-items:center; gap:clamp(22px,5vw,62px); padding:clamp(12px,3vw,34px);
      border:1px solid #ffffffa8; border-radius:28px;
      background:rgba(255,250,247,.56); box-shadow:0 25px 75px #8b59601b; backdrop-filter:blur(14px);
      opacity:0; transform:translateY(18px); transition:opacity .95s ease,transform .95s ease;
    }
    .slide.active { opacity:1; transform:translateY(0); }
    .photo-frame { margin:0; position:relative; overflow:hidden; border-radius:20px; background:#eadde0; box-shadow:0 18px 40px #573e451c; aspect-ratio:4/5; max-height:66vh; }
    .photo-frame::after { content:""; position:absolute; inset:0; border:1px solid #fff8; border-radius:inherit; pointer-events:none; }
    .photo-frame img { display:block; width:100%; height:100%; object-fit:cover; animation:livingPhoto 8s ease-in-out infinite alternate; transform-origin:center; }
    @keyframes livingPhoto { from{transform:scale(1) translate3d(0,0,0)} to{transform:scale(1.075) translate3d(-1.2%,.8%,0)} }
    .petal-field { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:3; }
    .petal-field span {
      position:absolute; top:-38px; left:var(--left); width:var(--size); height:calc(var(--size) * 1.45);
      border-radius:80% 10% 80% 10%;
      background:linear-gradient(135deg,#fff0f2 0%,#f2b5c2 48%,#cf718b 100%);
      opacity:0; filter:drop-shadow(0 2px 4px #9b526344);
      animation:petalFall var(--duration) linear var(--delay) infinite;
      will-change:transform,opacity;
    }
    @keyframes petalFall {
      0%{transform:translate3d(0,-5vh,0) rotate(0deg);opacity:0}
      9%{opacity:var(--opacity)}
      50%{transform:translate3d(var(--drift),52vh,0) rotate(190deg);opacity:var(--opacity)}
      100%{transform:translate3d(calc(var(--drift) * -0.45),112vh,0) rotate(430deg);opacity:0}
    }
    @media (prefers-reduced-motion:reduce) { .petal-field span { animation-duration:14s; } }
    .slide.leaving { opacity:0; transform:scale(.96); filter:blur(7px); transition:opacity 1s ease,transform 1s ease,filter 1s ease; }
    .photo-frame .fallback { display:none; height:100%; min-height:280px; place-items:center; padding:25px; text-align:center; color:var(--muted); }
    .copy { padding:clamp(10px,2vw,28px); }
    .eyebrow { color:var(--gold); text-transform:uppercase; letter-spacing:.2em; font-size:.7rem; font-weight:700; margin-bottom:17px; }
    .copy h1 { font:600 clamp(2.5rem,5.6vw,4.6rem)/.98 "Cormorant Garamond",Georgia,serif; color:var(--rose-dark); margin:0 0 20px; }
    .copy p { font-size:clamp(.98rem,1.5vw,1.13rem); line-height:1.85; color:#6e5b61; margin:0; }
    .ornament { color:var(--gold); margin-top:26px; letter-spacing:.45em; }
    .slide[data-animation="left"] .photo-frame { animation:fromLeft 1s both; }
    .slide[data-animation="left"] .copy { animation:fromRight 1s .18s both; }
    .slide[data-animation="zoom"] .photo-frame { animation:zoomIn 1.15s both; }
    .slide[data-animation="zoom"] .copy { animation:rise .9s .25s both; }
    .slide[data-animation="tilt"] .photo-frame { animation:tiltIn 1.1s both; }
    .slide[data-animation="tilt"] .copy { animation:fadeUp 1s .2s both; }
    .slide[data-animation="parallax"] .photo-frame { animation:parallaxIn 1.2s both; }
    .slide[data-animation="parallax"] .copy { animation:fromRight 1s .25s both; }
    .slide[data-animation="soft"] .photo-frame { animation:softIn 1.3s both; }
    .slide[data-animation="soft"] .copy { animation:fadeUp 1s .25s both; }
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes fadeUp{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:none}}
    @keyframes rise{from{opacity:0;transform:translateY(35px) scale(.97)}to{opacity:1;transform:none}}
    @keyframes fromLeft{from{opacity:0;transform:translateX(-65px)}to{opacity:1;transform:none}}
    @keyframes fromRight{from{opacity:0;transform:translateX(45px)}to{opacity:1;transform:none}}
    @keyframes zoomIn{from{opacity:0;transform:scale(.84)}to{opacity:1;transform:scale(1)}}
    @keyframes tiltIn{from{opacity:0;transform:rotate(-5deg) scale(.9)}to{opacity:1;transform:rotate(0) scale(1)}}
    @keyframes parallaxIn{from{opacity:0;transform:translateY(35px) scale(1.08)}to{opacity:1;transform:none}}
    @keyframes softIn{from{opacity:0;filter:blur(10px);transform:scale(.96)}to{opacity:1;filter:blur(0);transform:none}}
    .controls { display:flex; align-items:center; justify-content:center; gap:18px; padding:20px 0 6px; }
    .nav-btn { width:42px; height:42px; border:1px solid #c9788c55; border-radius:50%; background:#fffaf7b8; color:var(--rose-dark); cursor:pointer; font-size:20px; }
    .dots { display:flex; align-items:center; gap:9px; }
    .dot { width:8px; height:8px; border:0; border-radius:20px; background:#c99ba6; padding:0; cursor:pointer; transition:width .25s,background .25s; }
    .dot[aria-current="true"] { width:25px; background:var(--rose-dark); }
    .counter { text-align:center; color:#987e84; font-size:.75rem; letter-spacing:.12em; margin-top:6px; }
    .audio-warning { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); z-index:30; display:none; max-width:calc(100% - 28px); padding:11px 16px; border-radius:30px; background:#fffaf0; border:1px solid #e6cfaa; color:#7b6448; box-shadow:0 8px 25px #49383f18; font-size:.82rem; text-align:center; }
    .final-slide { grid-template-columns:1fr; text-align:center; min-height:430px; place-content:center; }
    .final-slide .copy { max-width:900px; margin:auto; }
    .final-slide h1 { text-shadow:0 5px 28px #d7b36b55; }
    .final-slide p { max-width:820px; margin:auto; font-size:clamp(1rem,1.7vw,1.2rem); line-height:1.95; }
    .final-slide .eyebrow { color:#b18a4d; }
    .final-slide .ornament { animation:goldPulse 2.8s ease-in-out infinite; }
    @keyframes goldPulse { 0%,100%{opacity:.65;text-shadow:0 0 4px #e8c77b} 50%{opacity:1;text-shadow:0 0 22px #d8ad55} }
    .final-slide h1 { font-size:clamp(3rem,8vw,6.2rem); }
    .replay { margin-top:30px; padding:14px 25px; border:0; border-radius:999px; color:white; background:linear-gradient(120deg,#c9788c,#a95770); box-shadow:0 10px 25px #a9577033; cursor:pointer; }
    #confetti { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:15; }
    @media(max-width:700px) {
      .screen { padding:78px 14px 25px; }
      .slide { grid-template-columns:1fr; gap:12px; padding:13px; border-radius:22px; }
      .photo-frame { width:min(100%,440px); aspect-ratio:4/3; max-height:43vh; margin:auto; }
      .copy { text-align:center; padding:10px 12px 17px; }
      .copy h1 { font-size:clamp(2.45rem,11vw,3.7rem); margin-bottom:12px; }
      .copy p { line-height:1.65; font-size:.94rem; }
      .eyebrow { margin-bottom:10px; }
      .ornament { margin-top:14px; }
      .slide-stage { min-height:0; }
      .final-slide { min-height:55vh; }
      .controls { padding-top:17px; }
    }
    @media(prefers-reduced-motion:reduce) {
      *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; scroll-behavior:auto!important; transition-duration:.01ms!important; }
    }
  </style>
</head>
<body>
  <button class="sound-toggle" id="soundToggle" type="button" aria-label="Включить или выключить звук" title="Звук">♫</button>
  <audio id="music" src="assets/music.mp3" loop preload="none"></audio>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main class="screen">
    <section class="intro" id="intro" aria-label="Закрытая открытка">
      <div class="intro-note">маленький сюрприз для тебя</div>
      <div class="envelope-wrap">
        <button class="envelope" id="openCard" type="button" aria-label="Открыть открытку">
          <span class="env-back"></span>
          <span class="letter"><strong>Для тебя</strong><span>с теплом и любовью</span></span>
          <span class="env-front"></span>
          <span class="env-flap"></span>
          <span class="seal">♥</span>
          <span class="surprise-heart" aria-hidden="true">♥</span>
        </button>
      </div>
      <div class="hint">Нажми, чтобы открыть</div>
    </section>

    <section class="showcase" id="showcase" aria-label="Поздравительное слайд-шоу">
      <div class="slide-stage" id="slideStage"></div>
      <div class="controls" id="controls">
        <button class="nav-btn" id="prev" type="button" aria-label="Предыдущий слайд">‹</button>
        <div class="dots" id="dots" aria-label="Выбрать слайд"></div>
        <button class="nav-btn" id="next" type="button" aria-label="Следующий слайд">›</button>
      </div>
      <div class="counter" id="counter" aria-live="polite"></div>
    </section>
  </main>
  <div class="audio-warning" id="audioWarning" role="status">Музыка пока недоступна, но праздник продолжается ♥</div>

  <script>
    // Меняйте фото, тексты и анимации в этом массиве.
    // Поддерживаемые animation: zoom, left, tilt, parallax, soft.
    const slides = [
      { photo:"assets/photo1.jpg", alt:'Семейная фотография 1', title:'С днём рождения!', text:'Пусть этот особенный день будет наполнен улыбками, нежностью и самыми дорогими людьми рядом.', animation:"zoom" },
      { photo:"assets/photo2.jpg", alt:'Семейная фотография 2', title:'Счастливые мгновения', text:'Пусть в памяти навсегда остаются светлые встречи, красивые места и радость быть вместе.', animation:"left" },
      { photo:"assets/photo3.jpg", alt:'Семейная фотография 3', title:'Любовь рядом', text:'Пусть забота и нежность близких согревают каждый день, а в сердце всегда живёт тепло.', animation:"tilt" },
      { photo:"assets/photo4.jpg", alt:'Семейная фотография 4', title:'Семья — наше счастье', text:'Пусть семейные объятия будут крепкими, встречи — частыми, а дом — полным радости.', animation:"parallax" },
      { photo:"assets/photo5.jpg", alt:'Семейная фотография 5', title:'Ярких дней и улыбок', text:'Желаю побольше солнечных дней, приятных сюрпризов и поводов улыбаться от души.', animation:"soft" },
      { photo:"assets/photo6.jpg", alt:'Семейная фотография 6', title:'Дорогие сердцу люди', text:'Пусть рядом всегда будут те, с кем легко, спокойно и по-настоящему хорошо.', animation:"zoom" },
      { photo:"assets/photo7.jpg", alt:'Семейная фотография 7', title:'Здоровья и добра', text:'Пусть каждый новый день приносит силы, душевный покой, здоровье и добрые вести.', animation:"left" },
      { photo:"assets/photo8.jpg", alt:'Семейная фотография 8', title:'Пусть сбываются мечты', text:'Пусть самые заветные желания исполняются, а впереди ждут удивительные открытия.', animation:"tilt" },
      { photo:"assets/photo9.jpg", alt:'Семейная фотография 9', title:'Вместе — лучше', text:'Пусть впереди будет ещё много путешествий, семейных историй и общих фотографий.', animation:"parallax" },
      { photo:"assets/photo10.jpg", alt:'Семейная фотография 10', title:'Тепло родного дома', text:'Пусть дома всегда ждут уют, понимание, добрые слова и любящие сердца.', animation:"soft" },
      { photo:"assets/photo11.jpg", alt:'Семейная фотография 11', title:'Красота вокруг', text:'Пусть жизнь будет такой же яркой и прекрасной, как самые красивые мгновения этого дня.', animation:"zoom" },
      { photo:"assets/photo12.jpg", alt:'Семейная фотография 12', title:'Счастья на каждом шагу', text:'Пусть даже маленькие события становятся большими поводами для радости.', animation:"left" },
      { photo:"assets/photo13.jpg", alt:'Семейная фотография 13', title:'Пусть будет светло', text:'Желаю внутреннего света, вдохновения и людей, которые поддерживают и ценят.', animation:"tilt" },
      { photo:"assets/photo14.jpg", alt:'Семейная фотография 14', title:'Берегите эти моменты', text:'Именно из таких простых и искренних мгновений складывается самое настоящее счастье.', animation:"parallax" },
      { photo:"assets/photo15.jpg", alt:'Семейная фотография 15', title:'Объятия близких', text:'Пусть рядом всегда будет плечо, на которое можно опереться, и руки, готовые обнять.', animation:"soft" },
      { photo:"assets/photo16.jpg", alt:'Семейная фотография 16', title:'Много поводов радоваться', text:'Пусть каждый год приносит новые впечатления, добрые встречи и счастливые перемены.', animation:"zoom" },
      { photo:"assets/photo17.jpg", alt:'Семейная фотография 17', title:'Пусть сердце поёт', text:'Желаю гармонии, любви, благополучия и исполнения самых светлых надежд.', animation:"left" },
      { photo:"assets/photo18.jpg", alt:'Семейная фотография 18', title:'Самые дорогие', text:'Пусть семейная любовь с годами становится только крепче, а воспоминания — дороже.', animation:"tilt" },
      { photo:"assets/photo19.jpg", alt:'Семейная фотография 19', title:'Спасибо за тепло', text:'Пусть добро, которое ты даришь окружающим, возвращается к тебе сторицей.', animation:"parallax" },
      { photo:"assets/photo20.jpg", alt:'Семейная фотография 20', title:'Новых счастливых историй', text:'Пусть впереди будет ещё множество прекрасных страниц, которые захочется сохранить.', animation:"soft" },
      { photo:"assets/photo21.jpg", alt:'Семейная фотография 21', title:'С любовью и нежностью', text:'Пусть счастье будет рядом — в родных улыбках, искренних словах и каждом новом дне.', animation:"zoom" }
    ];
    const finalSlide = {
      title:"Мамочка, с днём рождения!",
      text:"Спасибо тебе за тепло, которое ты даришь каждый день, за твою любовь, терпение и веру в меня. Ты — самое дорогое, что у меня есть. Пусть этот год принесёт тебе много радости, крепкого здоровья, лёгких дней и поводов для улыбки. Пусть сбывается всё, о чём ты мечтаешь, а я всегда буду рядом. Я тебя очень люблю!"
    };

    const intro = document.getElementById("intro");
    const openCard = document.getElementById("openCard");
    const showcase = document.getElementById("showcase");
    const stage = document.getElementById("slideStage");
    const dots = document.getElementById("dots");
    const counter = document.getElementById("counter");
    const audio = document.getElementById("music");
    const soundToggle = document.getElementById("soundToggle");
    const warning = document.getElementById("audioWarning");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let current = 0, timer = null, started = false, muted = false, confettiFrame = null;

    function showAudioWarning() {
      warning.style.display = "block";
      window.setTimeout(() => warning.style.display = "none", 5000);
    }
    function updateSoundButton() {
      soundToggle.textContent = muted ? "×" : "♫";
      soundToggle.setAttribute("aria-label", muted ? "Включить звук" : "Выключить звук");
      soundToggle.title = muted ? "Включить звук" : "Выключить звук";
    }
    function startMusic() {
      audio.volume = 0;
      audio.muted = muted;
      const playPromise = audio.play();
      if (playPromise && playPromise.then) {
        playPromise.then(() => {
          if (!muted) {
            let volume = 0;
            const fade = window.setInterval(() => {
              volume = Math.min(0.55, volume + 0.035);
              audio.volume = volume;
              if (volume >= 0.55) window.clearInterval(fade);
            }, 120);
          }
        }).catch(showAudioWarning);
      } else { showAudioWarning(); }
    }
    audio.addEventListener("error", showAudioWarning);
    soundToggle.addEventListener("click", () => {
      muted = !muted; audio.muted = muted; updateSoundButton();
      if (!muted && started && audio.paused) startMusic();
    });

    function renderSlide(index) {
      current = index;
      const isFinal = index === slides.length;
      const data = isFinal ? finalSlide : slides[index];
      stage.innerHTML = "";
      const article = document.createElement("article");
      article.className = "slide" + (isFinal ? " final-slide" : "");
      article.dataset.animation = isFinal ? "soft" : data.animation;
      if (isFinal) {
        article.innerHTML = `<div class="copy"><div class="eyebrow">от всего сердца</div><h1></h1><p></p><div class="ornament">✧　♥　✧</div><button class="replay" id="replay" type="button">Посмотреть ещё раз</button></div>`;
        article.querySelector("h1").textContent = data.title;
        article.querySelector("p").textContent = data.text;
      } else {
        article.innerHTML = `<figure class="photo-frame"><img><figcaption class="fallback">Фотография не загрузилась</figcaption></figure><div class="copy"><div class="eyebrow">с теплом и нежностью</div><h1></h1><p></p><div class="ornament">✧　♥　✧</div></div>`;
        const img = article.querySelector("img");
        img.src = data.photo; img.alt = data.alt;
        img.addEventListener("error", () => {
          img.style.display = "none";
          article.querySelector(".fallback").style.display = "grid";
        }, { once:true });
        article.querySelector("h1").textContent = data.title;
        article.querySelector("p").textContent = data.text;
      }
      stage.appendChild(article);
      // Более густой, но всё ещё лёгкий дождь лепестков на каждом фото-слайде.
      // Количество и скорость легко менять здесь.
      if (!isFinal) {
        const petals = document.createElement("div");
        petals.className = "petal-field";
        petals.setAttribute("aria-hidden", "true");
        const petalCount = 28;
        for (let i = 0; i < petalCount; i++) {
          const petal = document.createElement("span");
          const size = 9 + Math.random() * 9;
          petal.style.setProperty("--left", `${Math.random() * 100}%`);
          petal.style.setProperty("--size", `${size}px`);
          petal.style.setProperty("--duration", `${5.2 + Math.random() * 3.2}s`);
          // Отрицательная задержка заполняет весь экран лепестками сразу.
          petal.style.setProperty("--delay", `${-Math.random() * 8.4}s`);
          petal.style.setProperty("--drift", `${-55 + Math.random() * 110}px`);
          petal.style.setProperty("--opacity", `${0.48 + Math.random() * 0.3}`);
          petals.appendChild(petal);
        }
        stage.appendChild(petals);
      }
      requestAnimationFrame(() => article.classList.add("active"));
      dots.innerHTML = "";
      for (let i = 0; i <= slides.length; i++) {
        const dot = document.createElement("button");
        dot.className = "dot"; dot.type = "button";
        dot.setAttribute("aria-label", i === slides.length ? "Финальное поздравление" : `Слайд ${i+1}`);
        dot.setAttribute("aria-current", String(i === index));
        dot.addEventListener("click", () => goTo(i));
        dots.appendChild(dot);
      }
      counter.textContent = isFinal ? "С любовью ♥" : `${index+1} / ${slides.length+1}`;
      document.getElementById("controls").style.visibility = isFinal ? "hidden" : "visible";
      if (isFinal) { clearInterval(timer); timer = null; launchConfetti(); }
      else stopConfetti();
      const replay = document.getElementById("replay");
      if (replay) replay.addEventListener("click", restart);
    }
    let transitionLock = false;
    function goTo(index) {
      const nextIndex = Math.max(0, Math.min(slides.length, index));
      if (transitionLock) return;
      if (nextIndex === slides.length && current < slides.length) {
        transitionLock = true;
        clearInterval(timer); timer = null;
        const oldSlide = stage.querySelector(".slide");
        if (oldSlide) oldSlide.classList.add("leaving");
        window.setTimeout(() => {
          renderSlide(nextIndex);
          transitionLock = false;
        }, reduceMotion ? 20 : 1000);
        return;
      }
      renderSlide(nextIndex);
      resetTimer();
    }
    function resetTimer() {
      clearInterval(timer);
      if (current < slides.length) timer = window.setInterval(() => goTo(current + 1), 5000);
    }
    function startShow() {
      if (started) return;
      started = true;
      intro.classList.add("opening");
      startMusic();
      window.setTimeout(() => {
        intro.style.display = "none";
        showcase.classList.add("visible");
        renderSlide(0); resetTimer();
      }, reduceMotion ? 20 : 3900);
    }
    function restart() {
      stopConfetti();
      current = 0; renderSlide(0); resetTimer();
      if (audio.error) showAudioWarning();
      else if (!muted) {
        audio.currentTime = 0; startMusic();
      }
    }
    openCard.addEventListener("click", startShow);
    openCard.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") { event.preventDefault(); startShow(); }
    });
    document.getElementById("prev").addEventListener("click", () => goTo(current - 1));
    document.getElementById("next").addEventListener("click", () => goTo(current + 1));
    document.addEventListener("keydown", event => {
      if (!started || event.target.closest("button")) return;
      if (event.key === "ArrowLeft") goTo(current - 1);
      if (event.key === "ArrowRight") goTo(current + 1);
    });
    updateSoundButton();

    // Лёгкое конфетти на canvas без внешних библиотек.
    const canvas = document.getElementById("confetti"), ctx = canvas.getContext("2d");
    let particles = [];
    function resizeCanvas() { canvas.width = window.innerWidth * devicePixelRatio; canvas.height = window.innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); }
    window.addEventListener("resize", resizeCanvas); resizeCanvas();
    function launchConfetti() {
      if (reduceMotion) return;
      stopConfetti();
      const colors = ["#d58b9d","#e5c27e","#fff1e8","#a9bda7","#c7a2c9"];
      particles = Array.from({length:130}, () => ({
        x:Math.random()*innerWidth, y:-20-Math.random()*innerHeight*.5,
        vx:(Math.random()-.5)*2.8, vy:2+Math.random()*3.5,
        size:3+Math.random()*5, spin:Math.random()*6, color:colors[Math.floor(Math.random()*colors.length)]
      }));
      let frames = 0;
      function draw() {
        ctx.clearRect(0,0,innerWidth,innerHeight);
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.spin += .08;
          ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.spin); ctx.fillStyle=p.color;
          ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*1.5); ctx.restore();
        });
        particles = particles.filter(p => p.y < innerHeight+20);
        frames++;
        if (particles.length && frames < 700) confettiFrame = requestAnimationFrame(draw);
        else stopConfetti();
      }
      confettiFrame = requestAnimationFrame(draw);
    }
    function stopConfetti() {
      if (confettiFrame) cancelAnimationFrame(confettiFrame);
      confettiFrame = null; particles = [];
      if (ctx) ctx.clearRect(0,0,innerWidth,innerHeight);
    }
  </script>
</body>
</html>
